services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: paygo
      POSTGRES_PASSWORD: paygo
      POSTGRES_DB: paygo
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygo"]
      interval: 2s
      timeout: 2s
      retries: 15
