name: paygo-loadgen

services:
  postgres:
    image: postgres:18
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - synchronous_commit=on
      - -c
      - max_connections=200
    env_file: load.env.example
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygo"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build: &paygo-build
      context: ..
    entrypoint: ["/usr/local/bin/paygo-migrate"]
    env_file: load.env.example
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *paygo-build
    env_file: load.env.example
    environment:
      PAYGO_DB_MAX_CONNS: "64"
      PAYGO_RATE_LIMIT_RPS: "10000"
      PAYGO_RATE_LIMIT_BURST: "10000"
      PAYGO_REQUEST_TIMEOUT: 60s
    ports:
      - "18080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
