x-paygo-build: &paygo-build
  context: ..
  dockerfile: env/Dockerfile

x-paygo-environment: &paygo-environment
  PAYGO_DATABASE_URL: postgres://paygo:paygo@postgres:5432/paygo?sslmode=disable
  PAYGO_FAKE_WEBHOOK_TOKEN: local-webhook-token-change-me-0123456789
  PAYGO_OTLP_ENDPOINT: jaeger:4318

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: paygo
      POSTGRES_PASSWORD: paygo
      POSTGRES_DB: paygo
    ports:
      - "${PAYGO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paygo"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    build: *paygo-build
    entrypoint: ["/usr/local/bin/paygo-migrate"]
    environment:
      PAYGO_DATABASE_URL: postgres://paygo:paygo@postgres:5432/paygo?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *paygo-build
    environment:
      <<: *paygo-environment
      PAYGO_ADMIN_TOKEN: local-admin-token-change-me-0123456789
    ports:
      - "${PAYGO_API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: *paygo-build
    entrypoint: ["/usr/local/bin/paygo-worker"]
    environment:
      <<: *paygo-environment
      PAYGO_HTTP_ADDR: ":9091"
    depends_on:
      migrate:
        condition: service_completed_successfully

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.15.1
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

configs:
  prometheus:
    content: |
      global:
        scrape_interval: 5s
      scrape_configs:
        - job_name: paygo-api
          static_configs:
            - targets: ["api:8080"]
        - job_name: paygo-worker
          static_configs:
            - targets: ["worker:9091"]
