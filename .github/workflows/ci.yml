name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Benchmark module
        working-directory: bench
        run: |
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: paygo
          POSTGRES_PASSWORD: paygo
          POSTGRES_DB: paygo
        options: >-
          --health-cmd "pg_isready -U paygo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - 5432:5432
    env:
      PAYGO_TEST_DATABASE_URL: postgres://paygo:paygo@localhost:5432/postgres?sslmode=disable
      PAYGO_E2E_COVERDIR: ${{ github.workspace }}/cover
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Coverage gate
        run: |
          mkdir -p cover
          go test -race -tags integration -cover -coverpkg=./... ./... -args -test.gocoverdir="$PWD/cover"
          go tool covdata textfmt -i=cover -o cover.out
          go tool cover -func=cover.out
          go tool cover -func=cover.out | tail -n 1 | grep -q '100.0%'

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build .
